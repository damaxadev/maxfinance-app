@if (open()) {
  <div class="mfx-fab__backdrop" [@fadeInOut] (click)="close()"></div>
}

<div class="mfx-fab">
  @if (open()) {
    <div class="mfx-fab__options">
      @for (option of options; track option.id; let i = $index) {
        <button
          type="button"
          class="mfx-fab__option"
          [@fabOptionEnter]="{ value: true, params: { delay: staggerDelay(i) } }"
          (click)="selectOption(option)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }

  <button
    type="button"
    class="mfx-fab__trigger"
    [class.mfx-fab__trigger--open]="open()"
    [attr.aria-expanded]="open()"
    aria-label="Acciones rápidas"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" />
    </svg>
  </button>
</div>
