@if (accounts().length === 0) {
  <p class="mfx-form__error">
    Primero crea una cuenta (pestaña Movimientos) para poder registrar un pago recurrente.
  </p>
} @else {
  <form class="mfx-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="mfx-form__field">
      Nombre
      <input type="text" formControlName="name" placeholder="Ej. Netflix" />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <span class="mfx-form__error" role="alert">
          @if (form.controls.name.hasError('required')) {
            El nombre es obligatorio.
          } @else if (form.controls.name.hasError('minlength')) {
            El nombre debe tener al menos 2 caracteres.
          }
        </span>
      }
    </label>

    <label class="mfx-form__field">
      Monto
      <input type="number" formControlName="amount" min="0.01" step="0.01" placeholder="0" />
      @if (form.controls.amount.invalid && form.controls.amount.touched) {
        <span class="mfx-form__error" role="alert">
          @if (form.controls.amount.hasError('required')) {
            El monto es obligatorio.
          } @else if (form.controls.amount.hasError('min')) {
            El monto debe ser mayor a 0.
          }
        </span>
      }
    </label>

    <label class="mfx-form__field">
      Categoría
      <select formControlName="categoryId">
        <option value="" disabled>Selecciona una categoría</option>
        @for (category of expenseCategories(); track category.id) {
          <option [value]="category.id">{{ category.icon }} {{ category.name }}</option>
        }
      </select>
      @if (form.controls.categoryId.invalid && form.controls.categoryId.touched) {
        <span class="mfx-form__error" role="alert">Selecciona una categoría.</span>
      }
    </label>

    <label class="mfx-form__field">
      Cuenta
      <select formControlName="accountId">
        <option value="" disabled>Selecciona una cuenta</option>
        @for (account of accounts(); track account.id) {
          <option [value]="account.id">{{ account.name }}</option>
        }
      </select>
      @if (form.controls.accountId.invalid && form.controls.accountId.touched) {
        <span class="mfx-form__error" role="alert">Selecciona una cuenta.</span>
      }
    </label>

    <label class="mfx-form__field">
      Frecuencia
      <select formControlName="frequency">
        @for (option of frequencies; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>

    <label class="mfx-form__field">
      Próxima fecha
      <input type="date" formControlName="nextDate" />
      @if (form.controls.nextDate.invalid && form.controls.nextDate.touched) {
        <span class="mfx-form__error" role="alert">La fecha es obligatoria.</span>
      }
    </label>

    <mfx-checkbox formControlName="active">Activo</mfx-checkbox>

    @if (errorMessage()) {
      <p class="mfx-form__error" role="alert">{{ errorMessage() }}</p>
    }
    @if (notificationsMessage()) {
      <p class="mfx-form__success">{{ notificationsMessage() }}</p>
    }

    <div class="mfx-form__actions">
      @if (initialValue()) {
        <button type="button" class="mfx-btn-danger" [disabled]="saving() || deleting()" (click)="remove()">
          {{ deleting() ? 'Eliminando…' : 'Eliminar' }}
        </button>
      }
      <button type="submit" class="mfx-btn-primary" [disabled]="saving() || deleting() || form.invalid">
        {{ saving() ? 'Guardando…' : initialValue() ? 'Guardar cambios' : 'Agregar recurrente' }}
      </button>
    </div>
  </form>
}
