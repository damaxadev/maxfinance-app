<main class="mfx-login">
  <mfx-card class="mfx-login__card">
    <h1>MaxFinance</h1>
    <p>Inicia sesión para llevar tus gastos personales y compartidos.</p>

    <button type="button" class="mfx-google-btn" [disabled]="loading()" (click)="signInWithGoogle()">
      <svg class="mfx-google-btn__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.46c-.28 1.5-1.13 2.77-2.4 3.62v3h3.88c2.27-2.09 3.58-5.17 3.58-8.81z" />
        <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.92l-3.88-3c-1.08.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.09C3.24 21.3 7.29 24 12 24z" />
        <path fill="#FBBC05" d="M5.27 14.27A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.37-2.27V6.64H1.27A11.98 11.98 0 0 0 0 12c0 1.94.46 3.78 1.27 5.36l4-3.09z" />
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.29 0 3.24 2.7 1.27 6.64l4 3.09C6.22 6.86 8.87 4.75 12 4.75z" />
      </svg>
      <span>{{ loading() ? 'Conectando…' : 'Continuar con Google' }}</span>
    </button>

    @if (errorMessage()) {
      <p class="mfx-login__error" role="alert">{{ errorMessage() }}</p>
    }
  </mfx-card>
</main>
