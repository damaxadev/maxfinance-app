<section class="mfx-view">
  <h1>Inicio</h1>

  <div class="mfx-home__period">
    <p class="mfx-home__period-month">{{ monthLabel }}</p>
    <p class="mfx-home__period-range">{{ monthRangeLabel }}</p>
  </div>

  <mfx-card class="mfx-gradient-hero mfx-home__hero" [index]="0">
    <p class="mfx-home__hero-label">Balance total</p>
    <mfx-animated-number class="mfx-home__hero-amount" [value]="totalBalance()" prefix="$ " />
  </mfx-card>

  <mfx-card [index]="1">
    <p>Presupuesto del mes</p>
    <mfx-progress-ring [percentage]="budgetUsedPercent()" [color]="budgetRingColor()" />
  </mfx-card>

  <p>Balance por cuenta</p>

  @if (accounts().length === 0) {
    <mfx-card [index]="2">
      <p>Todavía no tienes cuentas. Créalas en la pestaña Movimientos.</p>
    </mfx-card>
  } @else {
    @for (account of accounts(); track account.id; let i = $index) {
      <mfx-card [index]="i + 2">
        <div class="mfx-home__account">
          <span>{{ account.name }}</span>
          <mfx-animated-number [value]="account.balance" prefix="$ " />
        </div>
      </mfx-card>
    }
  }
</section>
