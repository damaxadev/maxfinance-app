<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="dollar-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#ffffff" />
      <g fill="none" stroke="#000000" stroke-width="60" stroke-linecap="round">
        <path d="M512 490 V810" />
        <path d="M512 520 A65 65 0 0 0 512 650 A65 65 0 0 1 512 780" />
      </g>
    </mask>
  </defs>

  <!-- Escalado al 72% centrado en el lienzo: la zona segura de un ícono
       adaptativo de Android solo garantiza visible un círculo central
       (~61% del lienzo) — sin este margen, las esquinas de la casa se
       recortarían en launchers con máscara circular. -->
  <g transform="translate(512 512) scale(0.72) translate(-512 -512)">
    <path d="M512 220 L724 460 L724 820 L300 820 L300 460 Z" fill="#060B14" mask="url(#dollar-cutout)" />
  </g>
</svg>
